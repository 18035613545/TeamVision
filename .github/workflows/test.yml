# E1（实现方案 §11.1）：默认回归进 CI。约定维持 run_tests.bat 的只匹配 test*.py
# （e2e_*/soak_*/stress_* 不进 CI）。依赖显示环境的用例（Tk 根窗口）自带 SkipTest
# 兜底，headless 上跳过、本机全量仍会跑。
# dist-022（2026-09-24）：单测步骤改为直接调用 run_tests.bat——命令口径只有这一处，不再内联
# 复制（此前两处可各自漂移）。CI 上没有 conda/fps-screen 环境，用 TV_CI_NO_CONDA=1 让脚本
# 退回 setup-python 的 python；本机不定义该变量，run_tests.bat 行为不变。
# ruff/mypy 钉到本机实测版本（fps-screen 环境 ruff 0.16.8、base 环境 mypy 1.17.1）；mypy 配置
# 在 pyproject.toml，E2 起配有但从未执行（G25），故新增执行步骤——随本批修复（common.py
# 的 I001/B904/_msvcrt 赋值三处）后两道门在本机均为绿。
#
# P1-4/P1-5（2026-10-09）：ruff 的范围由「三个核心文件」扩到全部根模块。七轮自审漏掉的
# 两处真 bug 都落在当时不检查的文件里（logger.py 的 F821、host_ui.py 的 except 晚绑定闭包），
# 窄范围换来的"全绿"没有防护力。注意本机 PATH 上的 ruff 可能比这里钉的旧（0.12 vs 0.16），
# 本地验收请用 `python -m ruff`（fps-screen 环境）为准。
#
# R8-D-03（2026-10-10）：同一类缺口在 `tests/` 复发——lint 清单一字未提该目录，实测
# 89 处违规，含 `F821 Undefined name 'fy2'`（tests/test_panel_float_no_overlap.py 的
# T-14 核心不变量，被 `or` 短路掩盖到从未求值）与 `F823 referenced before assignment`。
# 范围扩到 `ruff check *.py tests`；`tests/` 只对 E702/E741 两类风格规则豁免，
# 理由写在 pyproject.toml 的 per-file-ignores。
name: tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # 第 12 轮（2026-10-23）：加手动触发。CI 此前**无法手动跑**（没有 workflow_dispatch），
  # "本机跑一遍看看"就得推个分支或改点无关代码——这是"门禁之外的事"长期没被跑起来的原因。
  workflow_dispatch:

jobs:
  unit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Lint (全仓根模块 + tests；范围见 pyproject.toml 顶部裁决)
        run: |
          pip install ruff==0.16.8
          ruff check *.py tests
      - name: Type check (mypy：4 个模块的符号面；函数体未注解故不在检查范围)
        run: |
          pip install mypy==1.17.1
          python -m mypy
      - name: Unit tests (run_tests.bat，口径单一来源)
        shell: cmd
        env:
          TV_CI_NO_CONDA: "1"
        run: cmd /c run_tests.bat

  # ---------------------------------------------------------------------------
  # 打包链冒烟（PyInstaller → Inno Setup）
  # ---------------------------------------------------------------------------
  # AGENTS.md 早就写着"打包、签名、安装包这条发布链**完全在 CI 之外**，改完只能手工
  # 验证"。第 9 轮的实际代价：installer.iss 里被我写进一条 Inno **不存在**的指令
  # （UninstallablePathsDataFiles），单测与 lint 全绿，直到真正编译安装包才炸——
  # 那条链当时连一道自动化的门都没有。
  #
  # 这个 job 把"能自动化的那部分"拉进 CI：编译两个 exe、编安装包、校验产物。
  # 刻意**不含**的两件事：
  #   - 签名：需要证书（TEAMVIEW_PFX），CI 里没有；sign_exe.ps1 无证书时会自签，
  #     那是本机行为，验不了"对外分发"这件事；
  #   - frpc.exe：第三方产物，不在仓库里（installer.iss 对它是 skipifsourcedoesntexist）。
  #
  # 触发：workflow_dispatch（手动）或打 v* tag（发版前自动验一次）。不挂 PR——
  # 一次完整打包约 10 分钟，不该让每个 PR 都付这个时间。
  package:
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Vendor dxcam/comtypes (spec 的硬校验缺一即失败)
        # fps-host.spec 里有一道硬校验：产物分析里找不到 dxcam/comtypes 就 SystemExit。
        # vendor/ 被 .gitignore（里面是第三方代码），干净克隆必然缺——必须在这里补上，
        # 否则打包 job 永远只报"缺 dxcam"，测不到真正的打包问题。
        # dxcam 必须取自 GitHub ra1nty/DXcam（PyPI 上的 0.0.5 是滞后的旧版），
        # 且钉到 v0.3.0 这个 tag：HEAD 会随上游变动，CI 不该被上游的提交弄红。
        run: |
          python -m pip install --no-deps "git+https://github.com/ra1nty/DXcam@v0.3.0" comtypes --target=vendor
      - name: Build exes (PyInstaller，版本与本机构建一致)
        run: |
          python -m pip install pyinstaller==6.21.0
          pyinstaller --noconfirm --clean fps-host.spec
          pyinstaller --noconfirm --clean fps-viewer.spec
      - name: Verify exe artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($p in @("dist\fps-host\fps-host.exe", "dist\fps-viewer\fps-viewer.exe")) {
            if (-not (Test-Path $p)) { throw "产物缺失: $p" }
          }
          # 视频编解码的 FFmpeg DLL 必须打进去：漏了 import av 失败被 codec.py 静默
          # 吞掉，用户端无声退回 JPEG（带宽 5-20 倍回退）——这正是 dist-068 的成因。
          $av = Get-ChildItem -Recurse "dist\fps-viewer\_internal" -Filter "av*.dll" -ErrorAction SilentlyContinue
          if (-not $av) { throw "观看端产物里没有 av 的 FFmpeg DLL —— collect_all('av') 可能被抹掉了" }
      - name: Install Inno Setup 6
        run: choco install innosetup --yes --no-progress
      - name: Compile installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "找不到 ISCC.exe（choco 安装路径不对？）" }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC 退出码 $LASTEXITCODE" }
      - name: Verify installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Get-ChildItem dist -Filter "TeamVision-Setup-*.exe" | Select-Object -First 1
          if (-not $exe) { throw "安装包未生成" }
          "安装包: $($exe.Name) $([math]::Round($exe.Length/1MB,1)) MB" | Write-Output

